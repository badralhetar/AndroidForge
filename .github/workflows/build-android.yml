name: Build Android APK

# AndroidForge — Universal Android APK Builder
#
# Workflow:
#   1. Acquire source ZIP
#   2. Extract ZIP
#   3. Detect project type
#   4. Configure toolchain
#   5. Install Android SDK components
#   6. Build project
#   7. Collect APKs and upload artifacts
#   8. Diagnose failures

on:
  workflow_dispatch:
    inputs:
      zip_source:
        description: "Where should the workflow get the source ZIP from?"
        type: choice
        required: true
        default: "input-directory"
        options:
          - "input-directory"
          - "download-url"
          - "release-asset"
      zip_path:
        description: "Exact path (relative to repo root) of the source ZIP in input/."
        required: false
        type: string
        default: ""
      zip_url:
        description: "Direct download URL (only used if 'download-url' is selected)"
        required: false
        type: string
        default: ""
      release_tag:
        description: "GitHub Release tag containing the ZIP (only used if 'release-asset' is selected)"
        required: false
        type: string
        default: ""
      build_variant:
        description: "Build variant to produce"
        type: choice
        required: true
        default: "auto"
        options:
          - "auto"
          - "debug"
          - "release"
          - "bundle"
      enable_ndk:
        description: "Install NDK even if no native code is detected (force-true)"
        type: boolean
        required: false
        default: false

  push:
    branches:
      - main
    paths:
      - "input/**.zip"

# Never expose secrets to the untrusted uploaded source ZIP.
permissions:
  contents: write
  actions: write

concurrency:
  group: androidforge-build-${{ github.ref }}-${{ github.event.inputs.zip_source || 'auto' }}
  cancel-in-progress: false

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=false"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      build_succeeded: ${{ steps.build.outputs.build_succeeded }}
      apk_count: ${{ steps.collect.outputs.apk_count }}
      primary_apk_name: ${{ steps.collect.outputs.primary_apk_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # Step 1: Acquire ZIP
      - name: Acquire source ZIP
        id: acquire
        run: |
          python scripts/acquire_zip.py \
            --source "${{ inputs.zip_source || 'input-directory' }}" \
            --url "${{ inputs.zip_url }}" \
            --tag "${{ inputs.release_tag }}" \
            --path "${{ inputs.zip_path }}"

      # Step 2: Extract ZIP
      - name: Extract source ZIP
        id: extract
        run: python scripts/extract_zip.py --zip "${{ steps.acquire.outputs.zip_path }}"

      # Step 3: Detect project
      - name: Detect project type
        id: detect
        run: |
          python scripts/detect_project.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --output detection.json
          echo "::group::Detection JSON"
          cat detection.json
          echo "::endgroup::"

      # Step 4: Configure toolchain
      - name: Configure toolchain
        id: toolchain
        run: |
          python scripts/setup_environment.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --android-sdk "$ANDROID_SDK_ROOT" \
            --output toolchain.json
          echo "::group::Toolchain JSON"
          cat toolchain.json
          echo "::endgroup::"

      # Step 5: Install JDK
      - name: Set up JDK (detected version)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "${{ steps.toolchain.outputs.jdk_version }}"
          cache: "gradle"

      - name: Set up JDK 8 (legacy fallback)
        if: steps.toolchain.outputs.jdk_version == '8'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      # Step 6: Set up Android SDK
      # Include SDK 35 because the detected project uses compileSdk/targetSdk 35.
      - name: Set up Android SDK (action)
        id: sdk_action
        continue-on-error: true
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 build-tools;34.0.0 build-tools;33.0.2 build-tools;32.0.0 build-tools;30.0.3 platforms;android-35 platforms;android-34 platforms;android-33 platforms;android-31 platforms;android-30 platforms;android-29 platforms;android-28 platforms;android-26 platforms;android-25"

      - name: Set up Android SDK (fallback via sdkmanager)
        if: steps.sdk_action.outcome == 'failure'
        run: |
          echo "Primary SDK setup failed. Falling back to direct sdkmanager calls."
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager was not found in Android SDK."
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          for pkg in \
            "platform-tools" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2" \
            "build-tools;32.0.0" \
            "build-tools;30.0.3" \
            "platforms;android-35" \
            "platforms;android-34" \
            "platforms;android-33" \
            "platforms;android-31" \
            "platforms;android-30" \
            "platforms;android-29" \
            "platforms;android-28" \
            "platforms;android-26" \
            "platforms;android-25"; do
            echo "Installing $pkg..."
            yes | "$SDKMGR" "$pkg" >/tmp/sdk-install.log 2>&1 || {
              echo "WARNING: install of $pkg failed; last output:"
              tail -30 /tmp/sdk-install.log || true
            }
          done
          echo "SDK fallback setup complete."

      # Step 7: Install NDK if needed
      - name: Install NDK (detected version)
        if: steps.toolchain.outputs.needs_ndk == 'true' || github.event.inputs.enable_ndk == 'true'
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Installing NDK ${{ steps.toolchain.outputs.ndk_version }}"
          yes | "$SDKMGR" --licenses >/dev/null || true
          yes | "$SDKMGR" "ndk;${{ steps.toolchain.outputs.ndk_version }}" || true
          yes | "$SDKMGR" "cmake;3.22.1" || true

      # Step 8: Set up Flutter if needed
      - name: Set up Flutter
        if: steps.toolchain.outputs.needs_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter_version }}"
          channel: "stable"
          cache: true

      # Step 9: Install standalone Gradle if wrapper is missing
      - name: Install standalone Gradle (fallback)
        if: steps.toolchain.outputs.use_wrapper == 'false'
        run: |
          GRADLE_VER="${{ steps.toolchain.outputs.gradle_version }}"
          echo "Installing Gradle $GRADLE_VER"
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"

      # Step 10: Cache Gradle dependencies and wrapper
      - name: Cache Gradle dependencies
        if: steps.toolchain.outputs.needs_gradle == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ steps.extract.outputs.project_root }}/.gradle
          key: gradle-${{ steps.toolchain.outputs.gradle_version }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ steps.toolchain.outputs.gradle_version }}-
            gradle-

      # Step 11: Build project
      - name: Build project
        id: build
        continue-on-error: true
        run: |
          python "$GITHUB_WORKSPACE/scripts/build_project.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" \
            --output "$GITHUB_WORKSPACE/build.json" || true
          if [ ! -f "$GITHUB_WORKSPACE/build.json" ]; then
            echo '{"build_succeeded": false, "successful_command": null, "exit_code": -1, "log_file": null}' > "$GITHUB_WORKSPACE/build.json"
          fi
          cat "$GITHUB_WORKSPACE/build.json"

      # Step 12: Collect APKs
      - name: Collect APKs
        id: collect
        if: always()
        run: |
          python "$GITHUB_WORKSPACE/scripts/collect_apk.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --output-dir "$GITHUB_WORKSPACE/output" \
            --output-json "$GITHUB_WORKSPACE/collect.json" || true
          if [ ! -f "$GITHUB_WORKSPACE/collect.json" ]; then
            echo '{"apk_count": 0, "primary": null, "all_apks": []}' > "$GITHUB_WORKSPACE/collect.json"
          fi
          cat "$GITHUB_WORKSPACE/collect.json"

      # Step 13: Upload APK artifact
      - name: Upload APK artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-APKs
          path: ${{ steps.collect.outputs.apk_directory }}/*.apk
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Upload AAB artifact (if any)
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-AAB
          path: ${{ steps.collect.outputs.apk_directory }}/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # Step 14: Publish APKs to an output release
      - name: Publish APKs to output release
        if: always() && steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="web-build-output-${{ github.run_id }}"
          echo "Creating release with tag $TAG..."
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Build #${{ github.run_number }} output" \
            --notes "Auto-generated by AndroidForge workflow run ${{ github.run_id }}." \
            --prerelease || true
          echo "Uploading built APKs/AABs to release $TAG..."
          cd "$GITHUB_WORKSPACE/output"
          shopt -s nullglob
          for f in *.apk *.aab; do
            echo "  -> $f"
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" || echo "WARNING: upload of $f failed"
          done
          echo "Done. Release $TAG now contains the built APKs."
          echo "output_release_tag=$TAG" >> "$GITHUB_ENV"
          echo "output_release_tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "## Output release"
            echo ""
            echo "Tag: \`$TAG\`"
            echo "URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo ""
            echo "Assets:"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 15: Upload build logs
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-logs
          path: |
            .androidforge/logs/
            ${{ steps.extract.outputs.project_root }}/build/outputs/
            ${{ steps.extract.outputs.project_root }}/**/build/reports/
            ${{ steps.extract.outputs.project_root }}/**/build/outputs/
          if-no-files-found: ignore
          retention-days: 14

      # Step 16: Diagnose failure
      - name: Diagnose failure
        if: steps.build.outputs.build_succeeded != 'true'
        run: |
          python "$GITHUB_WORKSPACE/scripts/diagnose_failure.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" || true

      # Step 17: Build summary
      - name: Build summary
        if: always()
        run: |
          python "$GITHUB_WORKSPACE/scripts/build_summary.py" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --build "$GITHUB_WORKSPACE/build.json" \
            --collect "$GITHUB_WORKSPACE/collect.json" || true

      # Final: fail the job if the build itself failed
      - name: Fail if build failed
        if: steps.build.outputs.build_succeeded != 'true'
        run: |
          echo "::error::Android build failed. See the diagnosis above and the AndroidForge-logs artifact."
          exit 1
