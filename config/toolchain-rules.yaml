AndroidForge Toolchain Rules

Single source of truth for Android build compatibility.

Android Gradle Plugin to minimum compatible Gradle versions.

agp_to_gradle:
"9.0": "9.1.0"
"8.13": "8.13"
"8.12": "8.13"
"8.11": "8.13"
"8.10": "8.11.1"
"8.9": "8.11.1"
"8.8": "8.10.2"
"8.7": "8.9"
"8.6": "8.7"
"8.5": "8.7"
"8.4": "8.6"
"8.3": "8.4"
"8.2": "8.2"
"8.1": "8.0"
"8.0": "8.0"
"7.4": "7.5"
"7.3": "7.4"
"7.2": "7.3.3"
"7.1": "7.2"
"7.0": "7.0"

Android Gradle Plugin to required JDK versions.

agp_to_jdk:
"9.x": "17"
"8.x": "17"
"7.x": "11"
"4.x": "11"
"3.x": "8"

Default Android SDK components.

android_sdk:
platforms:
- "platform-35"
- "platform-34"
- "platform-33"
- "platform-31"
- "platform-30"
- "platform-29"
- "platform-28"
build_tools:
- "36.0.0"
- "35.0.0"
- "34.0.0"
- "33.0.2"
- "32.0.0"
- "30.0.3"
extras:
- "android;m2repository"
- "google;m2repository"

Legacy Android NDK versions.

ndk:
default_version: "26.1.10909125"
legacy_versions:
- "25.2.9519653"
- "23.2.8568313"
- "21.4.7075529"

Default Flutter version.

flutter:
default_version: "3.24.0"

Legacy compatibility fixes.

legacy_fixes:

- name: "patch_gradle_wrapper"
  description: "Regenerate missing or corrupt Gradle wrapper files"
  applies_when: "wrapper_corrupt_or_missing"
- name: "disable_gradle_daemon"
  description: "Disable the Gradle daemon for very old versions"
  applies_when: "gradle_version < 4"
- name: "use_system_gradle"
  description: "Use a compatible system Gradle when the wrapper is unavailable"
  applies_when: "wrapper_incompatible_with_runner"
- name: "migrate_https"
  description: "Convert HTTP distribution URLs to HTTPS"
  applies_when: "wrapper_url_http"
- name: "inject_local_properties"
  description: "Create local.properties with the Android SDK path"
  applies_when: "no_local_properties"
- name: "add_google_maven"
  description: "Ensure required Maven repositories are configured"
  applies_when: "missing_repositories"

Build variants to attempt.

build_variants:

- "assembleDebug"
- "assembleRelease"
- "bundleDebug"

Dependency repositories.

dependency_fallbacks:

- "https://maven.google.com"
- "https://repo.maven.apache.org/maven2"
- "https://plugins.gradle.org/m2"
- "https://jitpack.io"
