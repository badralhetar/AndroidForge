# AndroidForge Toolchain Rules

# Android Gradle Plugin to Gradle compatibility
agp_to_gradle:
  "8.9": "8.11.1"
  "8.8": "8.10.2"
  "8.7": "8.9"
  "8.6": "8.7"
  "8.5": "8.7"
  "8.4": "8.6"
  "8.3": "8.4"
  "8.2": "8.2"
  "8.1": "8.0"
  "8.0": "8.0"
  "7.4": "7.5"
  "7.3": "7.4"
  "7.2": "7.3.3"
  "7.1": "7.2"
  "7.0": "7.0"
  "4.2": "6.7.1"
  "4.1": "6.5"
  "4.0": "6.1.1"
  "3.6": "5.6.4"
  "3.5": "5.4.1"
  "3.4": "5.1.1"
  "3.3": "4.10.1"
  "3.2": "4.6"
  "3.1": "4.4"
  "3.0": "4.1"

# Android Gradle Plugin to JDK compatibility
agp_to_jdk:
  "8.x": "17"
  "7.x": "11"
  "4.x": "11"
  "3.x": "8"

# Default tool versions
flutter:
  default_version: "3.24.0"

ndk:
  default_version: "26.1.10909125"

# Android SDK components
android_sdk:
  platforms:
    - "platform-34"
    - "platform-33"
    - "platform-31"
    - "platform-30"
    - "platform-29"
    - "platform-28"
    - "platform-27"
    - "platform-26"
    - "platform-25"
    - "platform-24"
    - "platform-23"
  build_tools:
    - "34.0.0"
    - "33.0.2"
    - "32.0.0"
    - "31.0.0"
    - "30.0.3"
    - "29.0.3"
    - "28.0.3"
    - "27.0.3"
  extras:
    - "android;m2repository"
    - "google;m2repository"

# Legacy Android SDK versions
legacy_versions:
  - "25.2.9519653"
  - "23.2.8568313"
  - "21.4.7075529"

# Legacy compatibility fixes
legacy_fixes:
  - name: "patch_gradle_wrapper"
    description: "Regenerate gradle-wrapper.jar if missing or corrupt"
    applies_when: "wrapper_corrupt_or_missing"

  - name: "disable_gradle_daemon"
    description: "Disable Gradle daemon for very old Gradle versions"
    applies_when: "gradle_version < 4"

  - name: "use_system_gradle"
    description: "Use a compatible system-installed Gradle"
    applies_when: "wrapper_incompatible_with_runner"

  - name: "migrate_https"
    description: "Rewrite HTTP distribution URLs to HTTPS"
    applies_when: "wrapper_url_http"

  - name: "inject_local_properties"
    description: "Create local.properties if missing"
    applies_when: "no_local_properties"

  - name: "add_google_maven"
    description: "Add Google Maven and Maven Central repositories if missing"
    applies_when: "missing_repositories"

# Build variants to attempt
build_variants:
  - "assembleDebug"
  - "assembleRelease"
  - "bundleDebug"

# Dependency repository fallbacks
dependency_fallbacks:
  - "https://maven.google.com"
  - "https://repo1.maven.org/maven2"
  - "https://plugins.gradle.org/m2"
  - "https://jitpack.io"
